{% extends 'tests_app/base.html' %}

{% block content %}
    <h1 class="mb-4">Создание нового теста</h1>

    <form method="post">
        {% csrf_token %}
        <div class="card mb-4">
            <div class="card-header">Основная информация</div>
            <div class="card-body">
                {{ test_form.as_p }}
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Создать тест</button>
        <a href="{% url 'test_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
