{% extends 'tests_app/base.html' %}

{% block content %}
    <h1 class="mb-4">Выберите тест для прохождения</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                {{ form.as_p }}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Начать тест</button>
        <a href="{% url 'test_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
